<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%">
  <defs>
    <clipPath id="shieldClip">
      <path d="M 20 20 L 300 20 L 300 210 C 300 280 220 335 160 365 C 100 335 20 280 20 210 Z" />
    </clipPath>
  </defs>

  <!-- Shield Base Background -->
  <g clip-path="url(#shieldClip)">
    <!-- Quadrant 1 (Top Left): BBS Teal -->
    <rect x="0" y="0" width="160" height="175" fill="#139a91" />
    <!-- Quadrant 2 (Top Right): White -->
    <rect x="160" y="0" width="160" height="175" fill="#ffffff" />
    <!-- Quadrant 3 (Bottom Left): White -->
    <rect x="0" y="175" width="160" height="210" fill="#ffffff" />
    <!-- Quadrant 4 (Bottom Right): BBS Teal -->
    <rect x="160" y="175" width="160" height="210" fill="#139a91" />

    <!-- Dark Navy Latin Cross -->
    <!-- Vertical Cross Beam -->
    <rect x="115" y="0" width="90" height="380" fill="#082142" />
    <!-- Horizontal Cross Beam -->
    <rect x="0" y="95" width="320" height="85" fill="#082142" />

    <!-- Open Book in the Center -->
    <g transform="translate(160, 138)">
      <!-- Left Page -->
      <path d="M -4 -46 C -32 -54 -68 -48 -84 -40 L -84 18 C -68 10 -32 6 -4 14 Z" fill="#ffffff" stroke="#082142" stroke-width="4" stroke-linejoin="round" />
      <!-- Right Page -->
      <path d="M 4 -46 C 32 -54 68 -48 84 -40 L 84 18 C 68 10 32 6 4 14 Z" fill="#ffffff" stroke="#082142" stroke-width="4" stroke-linejoin="round" />
      
      <!-- Inner Pages detail lines -->
      <path d="M -4 -40 C -30 -47 -64 -42 -76 -36" fill="none" stroke="#082142" stroke-width="2" />
      <path d="M 4 -40 C 30 -47 64 -42 76 -36" fill="none" stroke="#082142" stroke-width="2" />

      <!-- Center Spine -->
      <line x1="0" y1="-44" x2="0" y2="15" stroke="#082142" stroke-width="4" stroke-linecap="round" />

      <!-- Chinese Characters "培民" (Pei Min) -->
      <!-- Left Page: 培 -->
      <text x="-44" y="-8" font-family="'Source Han Serif SC', 'Noto Serif SC', 'SimSun', 'Songti SC', serif" font-weight="900" font-size="34" fill="#082142" text-anchor="middle">培</text>
      <!-- Right Page: 民 -->
      <text x="44" y="-8" font-family="'Source Han Serif SC', 'Noto Serif SC', 'SimSun', 'Songti SC', serif" font-weight="900" font-size="34" fill="#082142" text-anchor="middle">民</text>
    </g>

    <!-- Bottom BBS Letters on Navy Cross Stem -->
    <g transform="translate(160, 290)">
      <text x="0" y="0" font-family="'Times New Roman', 'Source Serif 4', 'Georgia', serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="3">BBS</text>
    </g>
  </g>

  <!-- Outer Shield Border in BBS Teal -->
  <path d="M 20 20 L 300 20 L 300 210 C 300 280 220 335 160 365 C 100 335 20 280 20 210 Z" fill="none" stroke="#139a91" stroke-width="16" stroke-linejoin="round" />
  <!-- Fine Inner Gold Accent Border -->
  <path d="M 28 28 L 292 28 L 292 208 C 292 274 216 326 160 354 C 104 326 28 274 28 208 Z" fill="none" stroke="#d2f2ef" stroke-width="2" opacity="0.6" />
</svg>
